<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minecraft 2D</title>
<style>:root{--bg:#f2f2f2}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111}}html,body{height:100%;margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:monospace}canvas{image-rendering:pixelated;max-width:100%;max-height:100%;aspect-ratio:256/240;height:min(100vh,100vw*240/256);background:#000;cursor:crosshair}</style></head><body><canvas id="c" width="256" height="240"></canvas>
<script>
const T=16,W=320,H=72,VW=256,GH=208,SEA=34;
const cv=document.getElementById('c'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
function hs(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
let WORLD_SEED=Math.floor(Math.random()*4294967296);
function worldHash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+WORLD_SEED)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967295}
function worldNoise(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);const a=worldHash(ix,iy),b=worldHash(ix+1,iy),c=worldHash(ix,iy+1),d=worldHash(ix+1,iy+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}
// ---- blocs: 1 herbe 2 terre 3 pierre 4 sable 5 neige 6 bois 7 feuilles 8 eau 9 lave 10 charbon 11 or 12 planches 13 torche 14 grès 15 glace 16 cactus
const HARD=[0,.6,.5,1.5,.4,.6,1,.2,0,0,2,3,.8,.1,1,.3,.4],NAMES=['','Herbe','Terre','Pierre','Sable','Neige','Bois','Feuilles','Eau','Lave','Charbon','Or','Planches','Torche','Grès','Glace','Cactus'];
const TEX=[];
function mk(id){const c=document.createElement('canvas');c.width=c.height=T;const x=c.getContext('2d');
const B={1:['#b04a1c','#8a3410'],2:['#b04a1c','#8a3410'],3:['#7c7c7c','#5a5a5a'],4:['#e0b040','#c89830'],5:['#b04a1c','#8a3410'],6:['#8a4a1e','#5e300f'],7:['#38c030','#1e8a18'],8:['#2060e0','#3a7cf0'],9:['#e03010','#ffb020'],10:['#7c7c7c','#5a5a5a'],11:['#7c7c7c','#5a5a5a'],12:['#c08040','#8a5a28'],13:['#0000','#0000'],14:['#e8b888','#c89868'],15:['#a0d8ff','#e0f4ff'],16:['#38a52b','#26751f']}[id];
for(let j=0;j<T;j++)for(let i=0;i<T;i++){x.fillStyle=hs(i+id*31,j+id*17)<.28?B[1]:B[0];if(id==6&&i%5==2)x.fillStyle=B[1];if(id==12&&(j%8==0||(i+(j>>3)*8)%16==0))x.fillStyle=B[1];if(id==8){x.globalAlpha=.75}x.fillRect(i,j,1,1);x.globalAlpha=1}
if(id==1||id==5){x.fillStyle=id==1?'#38c030':'#f4f8ff';x.fillRect(0,0,T,3);for(let i=0;i<T;i+=2){x.fillRect(i,3,1,1+(hs(i,id)<.5?1:0))}x.fillStyle=id==1?'#a0f060':'#cfe4ff';x.fillRect(0,0,T,1)}
if(id==3||id==10||id==11){x.fillStyle='#444';for(let k=0;k<3;k++){const a=Math.floor(hs(k,id)*10)+2,b=Math.floor(hs(id,k)*10)+2;x.fillRect(a,b,3,1);x.fillRect(a+2,b+1,1,2)}}
if(id==10||id==11){x.fillStyle=id==10?'#151515':'#ffd830';for(let k=0;k<5;k++)x.fillRect(Math.floor(hs(k,9+id)*13)+1,Math.floor(hs(9+id,k)*13)+1,2,2)}
if(id==7){x.fillStyle='#1e8a18';for(let k=0;k<4;k++){x.fillRect(k*4,k*4,4,1);x.fillRect(k*4+2,k*4+1,1,3)}}
if(id==13){x.fillStyle='#8a5a28';x.fillRect(7,6,2,10);x.fillStyle='#ffb020';x.fillRect(6,2,4,4);x.fillStyle='#fff070';x.fillRect(7,3,2,2)}
if(id==9){x.fillStyle='#ffd040';x.fillRect(0,0,T,2)}
if(id==15){x.fillStyle='#fff';x.fillRect(2,2,2,5);x.fillRect(4,2,2,2)}
if(id==16){x.fillStyle='#26751f';x.fillRect(4,0,8,16);x.fillStyle='#38a52b';x.fillRect(6,0,4,16);x.fillStyle='#175d1a';x.fillRect(3,0,1,16);x.fillRect(12,0,1,16);x.fillRect(5,4,2,2);x.fillRect(9,11,2,2)}
return c}
for(let i=1;i<=16;i++)TEX[i]=mk(i);
function loadImage(path,onload){const image=new Image();image.onload=()=>onload(image);image.onerror=()=>console.warn('Texture indisponible : '+path);image.src=path;return image}
const GUI_ICONS={};
for(const type of ['heart','hunger'])for(const state of ['full','mid','empty'])GUI_ICONS[type+'_'+state]=loadImage('assets/gui/'+type+'_'+state+'.png',image=>GUI_ICONS[type+'_'+state]=image);
for(const state of ['full','empty'])GUI_ICONS['xp_'+state]=loadImage('assets/gui/xp_'+state+'.png',image=>GUI_ICONS['xp_'+state]=image);
GUI_ICONS.bubble_full=loadImage('assets/gui/bubble_full.png',image=>GUI_ICONS.bubble_full=image);
const CHICKEN_SPRITE=loadImage('assets/character/chicken.png',()=>{});
const TILE_ASSETS={1:'grass_block',2:'dirt',3:'stone',4:'sand',6:'oak_log_side',7:'leaves',12:'oak_planks',16:'cactus'};
for(const[id,name]of Object.entries(TILE_ASSETS))loadImage('assets/tiles/'+name+'.png',image=>TEX[id]=image);
let LOG_TOP=null,SAND_TOP=null,CACTUS_TOP=null;loadImage('assets/tiles/oak_log_top.png',image=>LOG_TOP=image);loadImage('assets/tiles/sand_t.png',image=>SAND_TOP=image);loadImage('assets/tiles/cactus_t.png',image=>CACTUS_TOP=image);
const SKY_TEXTURES=['sky1','sky2','sky3'].map(name=>loadImage('assets/tiles/'+name+'.png',()=>{}));
const PLAYER_SPRITES={};
for(const pose of ['idle','walk','jump'])for(let frame=1;frame<=2;frame++)PLAYER_SPRITES[pose+frame]=loadImage('assets/character/steve_'+pose+frame+'.png',image=>PLAYER_SPRITES[pose+frame]=image);
const PLAYER_PARTS={};
for(const[name,file]of Object.entries({head:'steve_head.png',body:'steve_body.png',hand:'steve_hand.png',legsIdle:'steve_legs_idle.png',legsWalk1:'steve_legs_walk1.png',legsWalk2:'steve_legs_walk2.png',legsJump:'steve_legs_jump2.png'}))PLAYER_PARTS[name]=loadImage('assets/character/'+file,image=>PLAYER_PARTS[name]=image);
const ZOMBIE_PARTS={};
for(const[name,file]of Object.entries({head:'zombie_head.png',body:'zombie_body.png',hand:'zombie_hand.png',legsIdle:'zombie_legs_idle.png',legsWalk1:'zombie_legs_walk1.png',legsWalk2:'zombie_legs_walk2.png',legsJump:'zombie_legs_jump2.png'}))ZOMBIE_PARTS[name]=loadImage('assets/character/'+file,image=>ZOMBIE_PARTS[name]=image);
const CREEPER_PARTS={};
for(const[name,file]of Object.entries({head:'creeper_head.png',legsIdle:'creeper_legs.png',legsWalk1:'creeper_legs_walk1.png'}))CREEPER_PARTS[name]=loadImage('assets/character/'+file,image=>CREEPER_PARTS[name]=image);
let PLAYER_ANIMATION=null;
let ZOMBIE_ANIMATION=null;
let CREEPER_ANIMATION=null;
let PLAYER_ANIMATION_DATA=null;
const DEBUG_EDITOR={open:false,animation:'idle',frame:0,part:0,modified:false};
function loadJson(path){return new Promise((resolve,reject)=>{const request=new XMLHttpRequest();request.open('GET',path);request.onload=()=>{if((request.status>=200&&request.status<300)||(location.protocol=='file:'&&request.status==0)){try{resolve(JSON.parse(request.responseText))}catch(error){reject(error)}}else reject(new Error('Chargement impossible ('+request.status+') : '+path))};request.onerror=()=>reject(new Error('Chargement impossible : '+path));request.send()})}
function exportAnimations(){const blob=new Blob([JSON.stringify(PLAYER_ANIMATION_DATA,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='animations.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
loadJson('assets/character/animations.json').then(data=>{const player=data.entities&&data.entities.player;if(!player||!player.animations||!player.canvas)throw new Error('Configuration des animations joueur invalide');PLAYER_ANIMATION_DATA=data;PLAYER_ANIMATION=player;ZOMBIE_ANIMATION=data.entities.zombie||null;CREEPER_ANIMATION=data.entities.creeper||null}).catch(error=>console.error('Animations des entités indisponibles, utilisation des sprites de secours.',error));
// ---- monde
let dirty=1;const wd=new Uint8Array(W*H),surf=[],raw=[],bg=new Uint8Array(W*H);
const bio=x=>{const climate=worldNoise(x*.035,83);return climate<.22?3:climate>.72?1:climate<.4?2:0}; // 0 plaine 1 désert 2 neige 3 océan
const get=(x,y)=>x<0||x>=W||y>=H?3:y<0?0:wd[y*W+x],set=(x,y,b)=>{if(x>=0&&x<W&&y>=0&&y<H)wd[y*W+x]=b,dirty=1};const getb=(x,y)=>x<0||x>=W||y<0||y>=H?0:bg[y*W+x],setb=(x,y,b)=>{if(x>=0&&x<W&&y>=0&&y<H){bg[y*W+x]=b;dirty=1}};
function genWorld(){wd.fill(0);bg.fill(0);raw.length=0;surf.length=0;
for(let x=0;x<W;x++){const b=bio(x),height=worldNoise(x*.07,3);raw[x]=b==3?38+height*5:b==1?22+height*4:28+height*6}
for(let x=0;x<W;x++){let s=0,n=0;for(let k=-5;k<=5;k++){s+=raw[Math.min(W-1,Math.max(0,x+k))];n++}surf[x]=Math.round(s/n)}
for(let x=0;x<W;x++){const b=bio(x),s=surf[x];for(let y=s;y<H;y++){let id;const d=y-s;
if(d==0)id=b==1||b==3?4:b==2?5:1;else if(d<(b==3?8:4))id=b==1||b==3?(d<(b==3?8:3)?4:14):2;else{id=3;const r=worldHash(x,y*7+3);if(r<.04&&d>4)id=10;else if(r<.055&&d>20)id=11;
if(d>5&&y<H-1){const v=worldNoise(x*.12,y*.14)+.4*worldNoise(x*.3,y*.3);if(v>1.02){id=y>H-10?9:(worldNoise(x*.2+50,y*.2)>.72&&d>10?8:0)}}}
set(x,y,id)}
if(s>SEA)for(let y=SEA;y<s;y++)if(!get(x,y))set(x,y,8);
if((b==0||b==2)&&s<=SEA&&x%7==3&&worldHash(x,1)<.8&&x>3){for(let k=1;k<=4;k++)set(x,s-k,6);for(let dy=-6;dy<=-3;dy++)for(let dx=-2;dx<=2;dx++)if(!get(x+dx,s+dy)&&(Math.abs(dx)<2||dy>-6))set(x+dx,s+dy,7)}}
for(let x=4;x<W-4;x++){const b=bio(x),s=surf[x];if(b==1&&s<SEA&&worldHash(x,29)<.09&&!get(x,s-1)&&get(x,s)){const h=1+Math.floor(worldHash(x,30)*2);for(let k=1;k<=h;k++)set(x,s-k,16)}else if((b==0||b==2)&&s<=SEA&&(x%7==0||x%7==5)&&worldHash(x,2)<.75&&!get(x,s-1)&&get(x,s)){const h=3+Math.floor(worldHash(x,3)*3);for(let k=1;k<=h;k++)if(!get(x,s-k))setb(x,s-k,6);for(let dy=-h-2;dy<=-h+1;dy++)for(let dx=-2;dx<=2;dx++)if(!get(x+dx,s+dy)&&(Math.abs(dx)<2||dy>-h))setb(x+dx,s+dy,7)}}
for(let x=0;x<W;x++){const b=bio(x),s0=surf[x];for(let y=s0;y<H;y++){const d=y-s0;setb(x,y,d<(b==3?8:4)?(b==1||b==3?4:b==2?5:2):3)}}
}genWorld();
// ---- état
const P={x:28*T,y:(surf[28]-3)*T,w:10,h:14,vx:0,vy:0,dir:1,hp:16,food:16,air:8,xp:0,ft:0,rt:0,st:0,cd:0};
const inv={},keys={};let mL=0,sel=0,mx=0,my=0,md=false,mine=null,mp=0,TM=20,mobs=[],parts=[],rain=false,rt=30,msg='',mt=0,spT=0,hurt=0,t0=0;
const hot=()=>['pick','sword',...Object.keys(inv).filter(k=>inv[k]>0).map(k=>k=='meat'?k:+k)];
const say=(s)=>{msg=s;mt=3};
function hit(e){const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const b=get(x,y);if(b&&b!=8&&b!=9&&b!=13)return 1}return 0}
function mv(e,dx,dy){let n=Math.ceil(Math.abs(dx)),s=n?dx/n:0;for(let i=0;i<n;i++){e.x+=s;if(hit(e)){e.x-=s;e.bx=1;break}}n=Math.ceil(Math.abs(dy));s=n?dy/n:0;e.gr=0;for(let i=0;i<n;i++){e.y+=s;if(hit(e)){e.y-=s;if(dy>0)e.gr=1;e.vy=0;break}}}
function canClimb(e,dir){const tx=Math.floor((dir>0?e.x+e.w+1:e.x-1)/T),top=Math.floor((e.y+.01)/T),bottom=Math.floor((e.y+e.h-.01)/T);let wallY=-1;for(let y=top;y<=bottom;y++){const b=get(tx,y);if(b&&b!=8&&b!=9&&b!=13){wallY=y;break}}if(wallY<0)return false;const edgeY=wallY*T,rise=e.y+e.h-edgeY,maxRise=190*190/(2*650);if(rise<=0||rise>maxRise)return false;const candidate={x:dir>0?tx*T+1:(tx+1)*T-e.w-1,y:edgeY-e.h,w:e.w,h:e.h};return !hit(candidate)}
const inW=(e)=>{const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(get(x,y)==8)return true;return false},inL=(e)=>get(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h/2)/T))==9;
function dmg(n,kx){if(P.cd>0)return;P.hp-=n;beep(170,.16,'sawtooth',.06,-90);P.cd=.6;hurt=.2;P.vx=kx*120;P.vy=-120;if(P.hp<=0)die()}
function dig(x,y,L){const b=L?getb(x,y):get(x,y);if(!b||b==8||b==9)return;L?setb(x,y,0):set(x,y,0);const d=b==1||b==5?2:b==15?0:b;if(d)inv[d]=(inv[d]||0)+1;P.xp=Math.min(9,P.xp+.15);for(let k=0;k<5;k++)parts.push({x:x*T+8,y:y*T+8,vx:(Math.random()-.5)*80,vy:-Math.random()*80,l:.5,c:b==3?'#777':'#a54'})}
function spawn(){const day=dayF()>.5,px=P.x;let x=Math.floor((px+(Math.random()<.5?-1:1)*(90+Math.random()*100))/T);if(x<2||x>=W-2)return;let y=0;while(y<H&&!get(x,y))y++;if(y<1||get(x,y-1)==8)return;
const r=Math.random();let m;if(day){if(mobs.filter(m=>m.t=='chicken'||m.t=='bee').length>5)return;m=r<.5?{t:'chicken',w:8,h:7,hp:3}:{t:'bee',w:8,h:6,hp:2,fly:1}}else{if(mobs.filter(m=>m.t=='zombie'||m.t=='creeper').length>6)return;m=r<.6?{t:'zombie',w:10,h:14,hp:6}:{t:'creeper',w:10,h:14,hp:5,fuse:0}}
Object.assign(m,{x:x*T,y:(y-2)*T-(m.fly?20:0),vx:0,vy:0,dir:1,ft:0,cd:0});mobs.push(m)}
function dayF(){const p=(TM%240)/240;return Math.max(0,Math.min(1,Math.sin(p*6.2832)*2+.5))}
function boom(m){const cx=m.x+5,cy=m.y+7;for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)if(x*x+y*y<=9)dig(Math.floor(cx/T)+x,Math.floor(cy/T)+y);const d=Math.hypot(P.x-cx,P.y-cy);if(d<56){P.cd=0;dmg(Math.ceil(6*(1-d/56))+1,P.x>cx?1:-1)}m.hp=0}
function update(dt){TM+=dt;rt-=dt;if(rt<0){rain=!rain&&Math.random()<.6;rt=40+Math.random()*60}
P.cd-=dt;hurt-=dt;mt-=dt;{const qx=Math.floor((P.x+5)/T),qy=Math.floor((P.y+7)/T);for(let dy=-8;dy<=8;dy++)for(let dx=-10;dx<=10;dx++){const x=qx+dx,y=qy+dy;if(x>=0&&x<W&&y>=0&&y<H&&dx*dx*.64+dy*dy<=64)ex[y*W+x]=1}}const w=inW(P);
const l=keys.q||keys.arrowleft,r=keys.d||keys.arrowright,u=keys.w||keys.arrowup||keys[' '];
const sp=w?45:75;if(l&&!r){P.vx=-sp;P.dir=-1}else if(r&&!l){P.vx=sp;P.dir=1}else P.vx*=.7;
if(P.cd>.3)P.vx=P.vx;
if(w){P.vy=Math.min(P.vy+250*dt,50);if(u)P.vy=-120}else{P.vy=Math.min(P.vy+650*dt,420);if(u&&P.gr)P.vy=-215}
const pv=P.vy;mv(P,P.vx*dt,P.vy*dt);if(P.gr&&pv>330&&!w)dmg(Math.floor((pv-300)/45)+1,0);
if(inL(P)){P.lt=(P.lt||0)-dt;if(P.lt<=0){P.cd=0;dmg(2,0);P.lt=.5}}
// air
const hw=get(Math.floor((P.x+5)/T),Math.floor((P.y+2)/T))==8;if(hw){P.at=(P.at||0)+dt;if(P.at>1.5){P.at=0;if(P.air>0)P.air--;else{P.cd=0;dmg(1,0)}}}else{P.air=Math.min(8,P.air+dt*4)}
// faim
P.ft+=dt;if(P.ft>25){P.ft=0;P.food=Math.max(0,P.food-1)}P.rt+=dt;if(P.rt>5){P.rt=0;if(P.food>=10&&P.hp<16)P.hp++;else if(P.food==0&&P.hp>1)P.hp--}
// minage / attaque
P.st-=dt;const cx=P.x+5,cy=P.y+7,wx=mx+camX,wy=my+camY,tx=Math.floor(wx/T),ty=Math.floor(wy/T);const sh=hot()[sel%hot().length];
let target=null;if(md){const m=mL?null:mobs.find(m=>wx>=m.x-2&&wx<=m.x+m.w+2&&wy>=m.y-2&&wy<=m.y+m.h+2&&Math.hypot(m.x-cx,m.y-cy)<48);
if(m){if(P.st<=0){P.st=.4;m.hp-=sh=='sword'?4:1;m.vx=(m.x>cx?1:-1)*120;m.vy=-100;m.hit=.2;if(m.hp<=0){stats.kills++;if(m.t=='chicken')inv.meat=(inv.meat||0)+1}}}
else{const L=mL,bl=L?getb(tx,ty):get(tx,ty);if(Math.hypot(tx*T+8-cx,ty*T+8-cy)<=70&&bl&&bl!=8&&bl!=9){if(!mine||mine.x!=tx||mine.y!=ty||mine.l!=L)mine={x:tx,y:ty,l:L,h:HARD[bl]},mp=0;mp+=dt*(sh=='pick'?3:1);if(mp>=mine.h){dig(tx,ty,L);stats.mined++;beep(140+Math.random()*60,.05,'square',.04);mine=null}}else mine=null}}else mine=null;
// mobs
for(const m of mobs){m.ft+=dt;m.hit-=dt;const d=Math.hypot(P.x-m.x,P.y-m.y);const day=dayF()>.5;
if(m.t=='bee'){m.x+=Math.sin(m.ft*1.3+m.y)*20*dt+m.dir*15*dt;m.y+=Math.cos(m.ft*2)*15*dt;if(Math.random()<.01)m.dir*=-1;m.dir=m.dir||1;if(hit(m)){m.x-=m.dir*3;m.dir*=-1}}
else{m.vy=Math.min(m.vy+650*dt,420);const sw=inW(m);if(sw)m.vy=-60;let tgt=0;
if(m.t=='zombie'||m.t=='creeper'){m.give=(m.give||0)-dt;if(m.give>0)tgt=m.dir*.4;else if(d<150&&Math.abs(P.x-m.x)>3){tgt=P.x>m.x?1:-1;m.dir=tgt}else if(d<150)tgt=0;else{if(Math.random()<.02)m.dir=-m.dir||1;tgt=m.dir*.3}
if(m.t=='zombie'&&d<14&&P.cd<=0)dmg(2,P.x>m.x?1:-1);
if(m.t=='creeper'){if(d<30){m.fuse+=dt;tgt=0;if(m.fuse>1.2)boom(m)}else m.fuse=0}
if(day&&Math.random()<.003)m.hp=0}
else{if(Math.random()<.02)m.dir=Math.random()<.3?0:Math.random()<.5?-1:1;tgt=m.dir*.4}
